name: Update RBI & SEBI Regulatory Feed Data

on:
  schedule:
    # Run every 15 minutes for cloud updates.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # Manual refresh from Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"

concurrency:
  group: update-feed-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest RBI & SEBI regulatory data
        run: npm run fetch:live
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          CS_TEAM_RECIPIENTS: ${{ secrets.CS_TEAM_RECIPIENTS }}
          CEO_RECIPIENTS: ${{ secrets.CEO_RECIPIENTS }}

      - name: Commit updated data
        run: |
          git config user.name "regnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh regulatory compliance data [skip ci]"
          # Rebase onto main before pushing — this workflow runs every 15 minutes and can
          # overlap with the monthly workflows' own commits to data/*.json, so main may have
          # moved since checkout. Retry once after a short backoff in case two runs race here.
          git pull --rebase --autostash origin main
          git push || (sleep 5 && git pull --rebase --autostash origin main && git push)

