name: Monthly Acts & Rules / Secretarial Standards Check

on:
  schedule:
    # Runs once a month at 09:00 IST (03:30 UTC) on the 1st. Acts (Parliament) and
    # Secretarial Standards (ICSI) change far less often than RBI/SEBI, so this is
    # deliberately separate from update-feed.yml's 15-minute cron.
    - cron: "30 3 1 * *"
  workflow_dispatch: {} # Manual refresh from Actions tab

concurrency:
  group: monthly-regulatory-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monthly-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check Acts & Rules and Secretarial Standards for amendments
        run: npm run fetch:monthly
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          DEV_OPS_RECIPIENTS: ${{ secrets.DEV_OPS_RECIPIENTS }}
          CS_TEAM_RECIPIENTS: ${{ secrets.CS_TEAM_RECIPIENTS }}
          CEO_RECIPIENTS: ${{ secrets.CEO_RECIPIENTS }}

      - name: Commit updated data
        run: |
          git config user.name "regnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/acts-rules.json data/secretarial-standards.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: monthly Acts & Rules / Secretarial Standards refresh [skip ci]"
          git push
